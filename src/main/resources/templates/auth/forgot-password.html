<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | MedFlow AI</title><link rel="stylesheet" href="/css/app.css"><script src="https://unpkg.com/lucide@latest"></script></head><body class="auth-page"><aside class="auth-visual"><a class="auth-brand" href="/"><span class="auth-brand-mark"><i data-lucide="activity"></i></span>MedFlow AI</a><div class="auth-visual-content"><p class="auth-kicker">Secure recovery</p><h1>Your access, protected.</h1><p class="auth-visual-copy">We keep account recovery simple, private, and designed around the needs of care teams.</p></div><p class="auth-visual-footer">Your clinical work stays yours.</p></aside><main class="auth-main"><section class="auth-card"><header class="auth-card-header"><p class="auth-kicker">Account recovery</p><h2>Reset your password</h2><p>Enter your work email and we will send a secure reset link.</p></header><form class="auth-form" method="post" action="/forgot-password"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="auth-field"><label for="email">Work email</label><input id="email" type="email" name="email" placeholder="you@hospital.org" autocomplete="email" required></div><button class="auth-submit" type="submit">Send reset link <i data-lucide="arrow-right"></i></button></form><p th:if="${message}" th:text="${message}" class="auth-notice" aria-live="polite"></p><div class="auth-secondary-action"><a href="/login"><i data-lucide="arrow-left"></i>&nbsp;Back to sign in</a></div></section></main><script src="/js/app.js"></script></body></html>
