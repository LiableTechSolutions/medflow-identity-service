spring.application.name=medflow-auth-service

# ==========================
# Database Configuration
# ==========================

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/medflow_auth;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================
# Email Configuration
# ==========================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:mahajannj28@gmail.com}
spring.mail.password=${MAIL_PASSWORD:whzt dukk ylew vpif}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================
# Application Configuration
# ==========================

medflow.auth.base-url=${APP_BASE_URL:http://localhost:8080}
medflow.auth.password-reset-expiry=${PASSWORD_RESET_EXPIRY:PT30M}

# ==========================
# OTP Configuration
# ==========================

medflow.otp.provider=${OTP_PROVIDER:smtp}
medflow.otp.length=${OTP_LENGTH:6}
medflow.otp.expiry=${OTP_EXPIRY:PT10M}
medflow.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:PT1M}
medflow.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# ==========================
# Authentication Policy
# ==========================

medflow.auth.default-policy=${AUTH_DEFAULT_POLICY:PASSWORD_ONLY}



# ==========================
# Session Configuration
# ==========================

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# ==========================
# Thymeleaf
# ==========================

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==========================
# Logging
# ==========================

logging.level.com.medflow=INFO